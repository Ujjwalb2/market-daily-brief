<!doctype html>
<html lang="en" class="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>AlphaPad</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('today-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>/* AlphaPad phone app — calm, AlphaPad tokens, dark default + light */
:root{
  --white:#FFFFFF;--teal:#00C99A;--amber:#F0A04B;--red:#E05252;--blue:#3282E8;
  --indigo-500:#3F5BD9;--indigo-600:#3452C9;
  --slate-50:#F8FAFC;--slate-200:#CBD5E1;--slate-400:#8793A5;--slate-500:#7B8799;--slate-600:#63758F;
  --navy-600:#34445B;--navy-700:#252F3F;--navy-800:#1D2432;--navy-850:#171B26;--navy-900:#101827;
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tabh:64px;--safe-b:env(safe-area-inset-bottom,0px);
}
:root,:root[data-theme="dark"]{color-scheme:dark;
  --surface-canvas:var(--navy-900);--surface-raised:var(--navy-850);--surface-elevated:var(--navy-800);
  --surface-glass:rgba(255,255,255,.05);--surface-hover:rgba(63,91,217,.15);--surface-hover-stroke:rgba(63,91,217,.30);
  --text-primary:var(--slate-50);--text-secondary:var(--slate-200);--text-tertiary:var(--slate-400);
  --border-decorative:var(--navy-700);--border-glass:rgba(255,255,255,.12);--focus-outer:var(--slate-200);
  --action-primary:var(--indigo-500);--action-hover:var(--indigo-600);--link:#8FA3FF;
  --fin-positive-soft:rgba(0,201,154,.12);--fin-negative-soft:rgba(123,135,153,.12);
  --fb-warning-soft:rgba(240,160,75,.12);--fb-info-soft:rgba(50,130,232,.12);--fb-error-soft:rgba(224,82,82,.12);
  --up-text:var(--teal);--warn-text:var(--amber);--track:rgba(255,255,255,.08);--scrim:rgba(8,12,20,.6);--bar-bg:rgba(16,24,39,.86);}
:root[data-theme="light"]{color-scheme:light;
  --surface-canvas:var(--slate-50);--surface-raised:var(--white);--surface-elevated:var(--white);
  --surface-glass:rgba(16,24,39,.04);--text-primary:var(--navy-900);--text-secondary:var(--navy-600);--text-tertiary:var(--navy-600);
  --border-decorative:var(--slate-200);--border-glass:var(--slate-200);--focus-outer:var(--indigo-500);--link:var(--indigo-500);
  --up-text:rgb(4,120,87);--warn-text:rgb(180,83,9);--track:rgba(16,24,39,.08);--scrim:rgba(16,24,39,.4);--bar-bg:rgba(248,250,252,.9);}
*{box-sizing:border-box}
html{background:var(--surface-canvas);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font:400 15px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus-outer);outline-offset:2px;border-radius:6px}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
@media (min-width:600px){body{background:var(--surface-canvas)}#app{border-left:1px solid var(--border-decorative);border-right:1px solid var(--border-decorative)}}

/* ---------- screens ---------- */
.scr{display:none;padding:0 20px calc(var(--tabh) + var(--safe-b) + 28px)}
.scr.on{display:block;animation:scrIn .22s ease}
.app.playing .scr{padding-bottom:calc(var(--tabh) + var(--safe-b) + 88px)}
@keyframes scrIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scr.on{animation:none}}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;min-height:56px;margin:0 -20px;padding:10px 20px;background:var(--bar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top h1{margin:0;font:700 22px/1.2 var(--font-sans);letter-spacing:-.4px}
.top .sp{flex:1}
.logo{font:700 19px/1 var(--font-sans);letter-spacing:-.4px}.logo span{color:var(--teal)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9999px;border:1px solid var(--border-decorative);font:600 13px/1 var(--font-sans);color:var(--text-primary);white-space:nowrap}
.chip small{font:500 12.5px/1 var(--font-sans);color:var(--text-tertiary)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-elevated);border:1px solid var(--border-decorative);font:600 13px/1 var(--font-sans);color:var(--text-secondary)}

/* ---------- type + common ---------- */
.eb{font:600 11.5px/1.3 var(--font-sans);letter-spacing:1.1px;text-transform:uppercase;color:var(--text-tertiary)}
.h2{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
.h2 h2{margin:0;font:600 18px/1.25 var(--font-sans);letter-spacing:-.2px}
.h2 .sp{flex:1}
.h2 a,.h2 button.l{font:600 13.5px/1 var(--font-sans);color:var(--link)}
.h2 small{font:500 12.5px/1.2 var(--font-sans);color:var(--text-tertiary)}
.muted{color:var(--text-tertiary)}
.u{color:var(--up-text)}.w{color:var(--warn-text)}.d{color:var(--text-tertiary)}
.card{padding:16px;border-radius:16px;background:var(--surface-raised);border:1px solid var(--border-decorative)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 20px;border-radius:12px;font:600 15px/1 var(--font-sans);white-space:nowrap}
.btn.p{background:var(--action-primary);color:#fff}.btn.p:active{background:var(--action-hover)}
.btn.g{border:1px solid var(--border-decorative);color:var(--text-primary)}
.btn.s{height:40px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn .pi{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.2);font-size:9px}
.ic{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:11px}
.ic svg{width:18px;height:18px}
.ic.t{background:var(--fin-positive-soft);color:var(--teal)}.ic.a{background:var(--fb-warning-soft);color:var(--amber)}.ic.b{background:var(--fb-info-soft);color:var(--blue)}.ic.i{background:rgba(63,91,217,.16);color:var(--link)}.ic.s{background:var(--fin-negative-soft);color:var(--slate-500)}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-glass)}
.seg button{flex:1;height:34px;border-radius:9px;font:600 13px/1 var(--font-sans);color:var(--text-tertiary)}
.seg button[aria-pressed=true]{background:var(--surface-elevated);color:var(--text-primary);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:34px;padding:0 14px;border-radius:9999px;border:1px solid var(--border-decorative);font:600 13px/1 var(--font-sans);color:var(--text-secondary)}
.chips button[aria-pressed=true]{background:var(--text-primary);border-color:var(--text-primary);color:var(--surface-canvas)}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 0;text-align:left;border-bottom:1px solid var(--border-decorative)}
.list>li:last-child>.row,.list>.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0;display:grid;gap:2px}
.row .tx b{font:600 15px/1.3 var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{font:400 13px/1.35 var(--font-sans);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .vl{text-align:right;font:600 14.5px/1.3 var(--font-sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .vl small{display:block;font:500 12.5px/1.3 var(--font-sans)}
.row .go{color:var(--text-tertiary);font-size:18px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:9999px;background:var(--amber);color:var(--navy-900);font:700 11.5px/1 var(--font-sans)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--surface-glass);font:600 11.5px/1 var(--font-sans);color:var(--text-secondary)}
.tag.w{background:var(--fb-warning-soft);color:var(--text-primary)}
.note{margin:14px 0 0;font:400 12px/1.5 var(--font-sans);color:var(--text-tertiary)}
.bars{display:grid;gap:10px}
.br{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center}
.br b{font:600 14px/1.2 var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .vl{font:600 14px/1 var(--font-sans);font-variant-numeric:tabular-nums}
.br .tr{grid-column:1/-1;height:6px;border-radius:4px;background:var(--track);overflow:hidden}
.br .tr i{display:block;height:100%;border-radius:4px;background:var(--teal)}
.br .tr i.d{background:var(--slate-500)}.br .tr i.a{background:var(--amber)}.br .tr i.b{background:var(--blue)}

/* ---------- today ---------- */
.hero-main{position:relative;display:flex;flex-direction:column;gap:14px;padding-top:12px}
.hero-main h2{margin:0;font:700 30px/1.15 var(--font-sans);letter-spacing:-.8px}
.hero-main .sub{margin:-4px 0 0;font:400 16px/1.5 var(--font-sans);color:var(--text-secondary)}
.hero-main .acts{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-top:4px}
.hero-main .ob-chip{display:none}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:22px;padding:16px 0 0;border-top:1px solid var(--border-decorative)}
.nm{display:grid;gap:3px;min-width:0}
.nm+.nm{padding-left:14px;border-left:1px solid var(--border-decorative);margin-left:14px}
.nm span{font:500 12px/1.2 var(--font-sans);color:var(--text-tertiary)}
.nm b{font:600 17px/1.2 var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.nm em{font-style:normal;font:600 12px/1 var(--font-sans)}
.nxt{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--surface-glass);font:500 13.5px/1.4 var(--font-sans);color:var(--text-tertiary);text-align:left;width:100%}
.nxt .dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px var(--fb-warning-soft)}
.nxt b{color:var(--text-primary)}
.nxt .go{margin-left:auto}
/* spotlight: swipe cards */
.spw{margin:0 -20px}
.sp-tr{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 20px 4px;scroll-padding:0 20px}
.sp-tr::-webkit-scrollbar{display:none}
.sl{flex:0 0 calc(100% - 24px);scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;background:var(--surface-raised);border:1px solid var(--border-decorative)}
.sl .kr{display:flex;align-items:center;gap:9px;font:600 11px/1.2 var(--font-sans);letter-spacing:1px;text-transform:uppercase;color:var(--text-tertiary)}
.sl .kr .ic{width:26px;height:26px;border-radius:8px}.sl .kr .ic svg{width:14px;height:14px}
.sl .tt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sl .tt b{font:700 24px/1.1 var(--font-sans);letter-spacing:-.5px}
.sl .tt .v{font:600 16px/1 var(--font-sans);font-variant-numeric:tabular-nums}
.sl .tt .dd{font:600 13.5px/1 var(--font-sans);color:var(--up-text)}
.sl p{margin:0;font:400 14px/1.45 var(--font-sans);color:var(--text-secondary)}
.sl .ac{display:flex;gap:16px;align-items:center;margin-top:auto;padding-top:4px}
.sl .ac a,.sl .ac button{font:600 14px/1 var(--font-sans);color:var(--link)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:9999px;background:var(--track);transition:width .2s,background .2s}
.dots i.on{width:18px;background:var(--teal)}
.v-sd{position:relative;height:84px;border-radius:12px;overflow:hidden;background:var(--surface-glass)}
.v-sd svg{position:absolute;inset:0;width:100%;height:100%}
.v-sd polyline{fill:none;stroke:var(--teal);stroke-width:2;stroke-linejoin:round}
.v-sd .oh{stroke:var(--text-tertiary);stroke-dasharray:3 3;stroke-width:1}
.v-sd .oh-l{position:absolute;left:8px;top:6px;z-index:1;padding:2px 6px;border-radius:5px;background:var(--surface-raised);font:500 11px/1 var(--font-sans);color:var(--text-tertiary)}
.v-ch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.v-ch span{display:grid;gap:3px;padding:8px 10px;border-radius:10px;background:var(--surface-glass);font:500 11.5px/1.2 var(--font-sans);color:var(--text-tertiary)}
.v-ch b{font:600 15px/1.1 var(--font-sans);color:var(--text-primary);font-variant-numeric:tabular-nums}
.ring{--p:50;position:relative;width:84px;height:84px;flex:none;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--slate-500) 0);display:grid;place-items:center;align-content:center}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface-raised)}
.ring b,.ring small{position:relative;line-height:1}.ring b{font:700 18px/1 var(--font-sans)}.ring small{font:500 11px/1.4 var(--font-sans);color:var(--text-tertiary)}
.v-br{display:flex;gap:16px;align-items:center}
.v-br .bars{flex:1;min-width:0}
.v-q{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.v-q .q{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--surface-glass);border-left:3px solid var(--slate-500);text-align:left}
.v-q .q.qu{border-left-color:var(--teal)}.v-q .q.on{background:var(--fin-positive-soft)}
.v-q small{font:500 11.5px/1.2 var(--font-sans);color:var(--text-tertiary)}
.v-q b{font:700 20px/1.1 var(--font-sans);font-variant-numeric:tabular-nums}
.v-q em{font-style:normal;font:600 12.5px/1.2 var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-q .h{font:500 11px/1.2 var(--font-sans);color:var(--text-tertiary)}
.v-lg{display:flex;gap:14px;font:500 11.5px/1 var(--font-sans);color:var(--text-tertiary)}
.v-lg i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--blue);margin-right:6px;vertical-align:-1px}.v-lg i.p{opacity:.35}
.br .tr.two{display:flex}.br .tr.two i{border-radius:0}.br .tr.two i.p{opacity:.35}

/* ---------- markets ---------- */
.mk-nav{position:sticky;top:56px;z-index:19;margin:0 -20px;padding:6px 20px 10px;background:var(--bar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mk-nav .chips{margin:0 -20px}
section.sec{scroll-margin-top:118px}
.ixh{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.ixh b{font:700 30px/1.1 var(--font-sans);letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.ixh em{font-style:normal;font:600 14px/1 var(--font-sans)}
.ixh small{width:100%;font:500 12.5px/1.2 var(--font-sans);color:var(--text-tertiary)}
.ixc{position:relative;height:170px;margin:8px 0 4px}
.ixc svg{width:100%;height:100%;overflow:visible}
.ixc .ln{fill:none;stroke:var(--teal);stroke-width:2;stroke-linejoin:round}
.ixc .ln.w{stroke:var(--amber)}
.ixc .gl{stroke:var(--border-decorative);stroke-width:1}
.ixc text{font:500 10.5px var(--font-sans);fill:var(--text-tertiary)}
.ixc .tip{position:absolute;top:0;transform:translateX(-50%);padding:4px 8px;border-radius:8px;background:var(--surface-elevated);border:1px solid var(--border-glass);font:600 12px/1.3 var(--font-sans);white-space:nowrap;pointer-events:none}
.ixc .tip small{display:block;font:500 11px/1.2 var(--font-sans);color:var(--text-tertiary)}
.ixc .cur{stroke:var(--text-tertiary);stroke-dasharray:2 3}
.fo3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fo3 div{display:grid;gap:3px;padding:12px;border-radius:12px;background:var(--surface-glass);border-top:3px solid var(--slate-500)}
.fo3 .s{border-top-color:var(--teal)}.fo3 .m{border-top-color:var(--amber)}
.fo3 span{font:500 12px/1.2 var(--font-sans);color:var(--text-tertiary)}
.fo3 b{font:700 18px/1.15 var(--font-sans);font-variant-numeric:tabular-nums}
.fo3 small{font:400 11.5px/1.2 var(--font-sans);color:var(--text-tertiary)}
.foch{margin-top:14px}.foch svg{width:100%;height:auto}
.oib{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oib .q{display:grid;gap:4px;padding:12px;border-radius:14px;background:var(--surface-glass);border-left:3px solid var(--slate-500)}
.oib .q.u{border-left-color:var(--teal)}
.oib .q b{font:600 14px/1.2 var(--font-sans)}.oib .q .n{font:700 22px/1 var(--font-sans);font-variant-numeric:tabular-nums}
.oib .q small{font:500 11.5px/1.3 var(--font-sans);color:var(--text-tertiary)}
.oib .q ol{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px;font:500 12.5px/1.25 var(--font-sans)}
.oib .q ol li{display:flex;justify-content:space-between;gap:6px}.oib .q ol em{font-style:normal;color:var(--text-tertiary)}
.tl{position:relative;margin:4px 0 0;padding:0 0 0 22px;list-style:none}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--border-decorative)}
.tl li{position:relative;display:flex;gap:12px;padding:8px 0;font:500 14px/1.35 var(--font-sans)}
.tl li::before{content:"";position:absolute;left:-21px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--surface-canvas);box-shadow:inset 0 0 0 2px var(--slate-500)}
.tl li.past{color:var(--text-tertiary)}.tl li.past::before{background:var(--slate-500);box-shadow:none}
.tl li.next::before{box-shadow:inset 0 0 0 3px var(--amber)}
.tl li.ev b{font-weight:600}
.tl time{width:44px;flex:none;font-variant-numeric:tabular-nums;color:var(--text-tertiary)}
.tl .now{position:relative;padding:2px 0;font:600 11.5px/1 var(--font-sans);color:var(--amber)}
.tl .now::before{content:"";position:absolute;left:-19px;top:-1px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.tl li .g{margin-left:auto;font:500 11.5px/1.35 var(--font-sans);color:var(--text-tertiary)}
.cal .row{min-height:56px}
.cal .dt{width:44px;flex:none;display:grid;justify-items:center;gap:1px;padding:6px 0;border-radius:10px;background:var(--surface-glass)}
.cal .dt b{font:700 16px/1 var(--font-sans)}.cal .dt small{font:600 10.5px/1 var(--font-sans);color:var(--text-tertiary);text-transform:uppercase}
.ty{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--slate-500)}
.ty.ipo{background:var(--blue)}.ty.earn{background:var(--teal)}.ty.fno{background:var(--amber)}.ty.hol{background:var(--slate-500)}.ty.eco{background:var(--indigo-500)}
.fl .row{align-items:flex-start}
.fl .tm{width:44px;flex:none;font:500 12.5px/1.6 var(--font-sans);color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.fl .tx small{white-space:normal}
.flh{display:flex;align-items:center;gap:8px;margin:18px 0 2px;font:600 13px/1.2 var(--font-sans);color:var(--text-secondary)}
.flh i{width:8px;height:8px;border-radius:50%;background:var(--teal)}.flh i.b{background:var(--blue)}.flh i.w{background:var(--amber)}

/* ---------- ideas ---------- */
.sd .px{display:flex;align-items:baseline;gap:10px;margin:2px 0 10px;flex-wrap:wrap}
.sd .px b{font:700 28px/1.1 var(--font-sans);letter-spacing:-.6px}
.sd .px .v{font:600 18px/1 var(--font-sans);font-variant-numeric:tabular-nums}
.sd .why{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.sd .why li{display:flex;gap:10px;font:400 14px/1.45 var(--font-sans);color:var(--text-secondary)}
.sd .why li::before{content:"";width:6px;height:6px;flex:none;margin-top:8px;border-radius:50%;background:var(--teal)}
.sd .why li.r::before{background:var(--amber)}
.tcw{margin:0 -20px}
.tc-tr{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 20px 4px;scroll-padding:0 20px}
.tc-tr::-webkit-scrollbar{display:none}
.tc{flex:0 0 calc(100% - 24px);scroll-snap-align:start;display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:18px;background:var(--surface-raised);border:1px solid var(--border-decorative)}
.tc .hd{display:flex;align-items:flex-start;gap:10px}
.tc .hd b{display:block;font:700 19px/1.2 var(--font-sans)}
.tc .hd small{display:block;margin-top:3px;font:400 13px/1.35 var(--font-sans);color:var(--text-tertiary)}
.tc .hd .tag{margin-left:auto;background:var(--fin-positive-soft);color:var(--text-primary)}
.legs{display:grid;gap:6px}
.legs div{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--surface-glass);font:500 14px/1.2 var(--font-sans)}
.legs i{font-style:normal;width:38px;font:700 11.5px/1 var(--font-sans);text-transform:uppercase;letter-spacing:.5px}
.legs i.b{color:var(--up-text)}.legs i.s{color:var(--text-tertiary)}
.legs b{margin-left:auto;font-variant-numeric:tabular-nums}
.lv4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.lv4 div{display:grid;gap:3px;font:500 11.5px/1.2 var(--font-sans);color:var(--text-tertiary)}
.lv4 b{font:600 15px/1.2 var(--font-sans);color:var(--text-primary);font-variant-numeric:tabular-nums}
.pot{display:grid;gap:8px}
.pot .h{display:flex;justify-content:space-between;font:500 13px/1.2 var(--font-sans);color:var(--text-tertiary)}
.pot .h b{color:var(--text-primary)}
.pot .bar{position:relative;height:8px;border-radius:9999px;background:var(--track)}
.pot .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9999px;background:var(--teal)}
.pot .bar span{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--surface-raised);box-shadow:inset 0 0 0 3px var(--teal)}
.pot .l{display:flex;justify-content:space-between;font:500 11.5px/1.2 var(--font-sans);color:var(--text-tertiary)}
.risk3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:12px;border-top:1px solid var(--border-decorative)}
.risk3 div{display:grid;gap:3px;font:500 11.5px/1.2 var(--font-sans);color:var(--text-tertiary)}
.risk3 b{font:600 14.5px/1.2 var(--font-sans);color:var(--text-primary);font-variant-numeric:tabular-nums}
.flag{padding:10px 12px;border-radius:10px;background:var(--fb-warning-soft);border-left:3px solid var(--amber);font:400 12.5px/1.45 var(--font-sans);color:var(--text-secondary)}

/* ---------- journal ---------- */
.mnav{display:flex;align-items:center;gap:8px;margin:10px 0 0}
.mnav b{flex:1;text-align:center;font:600 16px/1.2 var(--font-sans)}
.mnav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--border-decorative);font-size:18px;color:var(--text-secondary)}
.mnav button:disabled{opacity:.35}
.inbox{display:grid;gap:12px;margin-top:16px;padding:16px;border-radius:16px;background:var(--fb-warning-soft);border:1px solid rgba(240,160,75,.35)}
.inbox .hd{display:flex;align-items:center;gap:10px;font:600 15px/1.3 var(--font-sans)}
.inbox .hd small{display:block;font:400 13px/1.4 var(--font-sans);color:var(--text-secondary)}
.inbox .row{min-height:52px;border-bottom-color:rgba(240,160,75,.25)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.kpi div{display:grid;gap:3px;padding:14px;border-radius:14px;background:var(--surface-raised);border:1px solid var(--border-decorative)}
.kpi span{font:500 12px/1.2 var(--font-sans);color:var(--text-tertiary)}
.kpi b{font:700 21px/1.15 var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi small{font:400 12px/1.3 var(--font-sans);color:var(--text-tertiary)}
.eq{height:150px;margin-top:4px}.eq svg{width:100%;height:100%;overflow:visible}
.eq .ln{fill:none;stroke:var(--teal);stroke-width:2;stroke-linejoin:round}
.eq .z{stroke:var(--text-tertiary);stroke-dasharray:3 4;opacity:.6}
.eq .ar{fill:var(--teal);opacity:.1}
.jcal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.jcal .hd{font:600 11px/1 var(--font-sans);color:var(--text-tertiary);text-align:center;padding-bottom:4px}
.jcal button,.jcal span.x{display:grid;gap:2px;align-content:center;justify-items:center;min-height:52px;padding:6px 2px;border-radius:10px;background:var(--surface-glass);font:600 12.5px/1.1 var(--font-sans)}
.jcal span.x{background:transparent}
.jcal button small{font:600 10.5px/1 var(--font-sans);font-variant-numeric:tabular-nums}
.jcal button.p{background:rgba(0,201,154,var(--a,.15))}
.jcal button.n{background:rgba(123,135,153,var(--a,.15))}
.jcal button.p small{color:var(--text-primary)}.jcal button.n small{color:var(--text-primary)}
.jcal button.sel{box-shadow:inset 0 0 0 2px var(--action-primary)}
.jcal button.nt{color:var(--text-tertiary);font-weight:500}
.ins{display:grid;gap:10px}
.ins div{display:block;padding:12px 14px;border-radius:14px;background:var(--surface-raised);border:1px solid var(--border-decorative);border-left:3px solid var(--blue);font:400 14px/1.45 var(--font-sans);color:var(--text-secondary)}
.ins div.w{border-left-color:var(--amber)}.ins div.g{border-left-color:var(--teal)}
.ins b{color:var(--text-primary)}
.score{display:flex;align-items:center;gap:16px}
.score .big{font:700 34px/1 var(--font-sans);letter-spacing:-.6px}
.score small{font:400 13px/1.4 var(--font-sans);color:var(--text-tertiary)}
.mist .br .tr i{background:var(--amber)}

/* ---------- you ---------- */
.prof{display:flex;align-items:center;gap:14px;margin-top:10px}
.prof .av{width:56px;height:56px;font-size:20px}
.prof b{display:block;font:700 20px/1.2 var(--font-sans)}
.prof small{font:400 13.5px/1.4 var(--font-sans);color:var(--text-tertiary)}
.stk{display:grid;gap:14px}
.stk .n{display:flex;align-items:center;gap:12px}
.stk .n b{font:700 34px/1 var(--font-sans)}
.stk .n span{font:500 14px/1.35 var(--font-sans);color:var(--text-secondary)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk span{display:grid;justify-items:center;gap:6px;font:500 11.5px/1 var(--font-sans);color:var(--text-tertiary)}
.wk i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font:700 12px/1 var(--font-sans);background:var(--track);color:var(--text-tertiary)}
.wk .done i{background:var(--teal);color:var(--navy-900)}
.wk .today i{background:transparent;box-shadow:inset 0 0 0 2px var(--teal);color:var(--text-primary)}
.wk .hol i,.wk .off i{background:transparent;box-shadow:inset 0 0 0 1px var(--border-decorative)}
.ms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ms div{display:grid;gap:3px;padding:10px 8px;border-radius:10px;background:var(--surface-glass);text-align:center;font:500 11px/1.25 var(--font-sans);color:var(--text-tertiary)}
.ms b{font:700 14px/1 var(--font-sans);color:var(--text-secondary)}
.ms .got{background:var(--fin-positive-soft)}.ms .got b{color:var(--text-primary)}
.lrn .kind{display:flex;align-items:center;gap:8px}
.lrn h3{margin:8px 0 6px;font:700 20px/1.25 var(--font-sans);letter-spacing:-.3px}
.lrn p{margin:0;font:400 15px/1.5 var(--font-sans);color:var(--text-secondary)}
.lrn p b{color:var(--text-primary);font-weight:600}
.lrn .ft{display:flex;align-items:center;gap:10px;margin-top:16px}
.lrn .ft .sp{flex:1}
.lrn .pg{display:flex;gap:6px}.lrn .pg i{width:8px;height:8px;border-radius:50%;background:var(--track)}.lrn .pg i.done{background:var(--teal)}.lrn .pg i.on{box-shadow:0 0 0 2px var(--text-tertiary)}
.lrn .ok{margin-bottom:10px;padding:10px 12px;border-radius:10px;background:var(--fin-positive-soft);font:600 13px/1.3 var(--font-sans)}
.navb{width:40px;height:40px;border-radius:12px;border:1px solid var(--border-decorative);font-size:18px;color:var(--text-secondary)}
.rst.arm{background:var(--fb-warning-soft);border-radius:12px}

/* ---------- tab bar, mini player ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:var(--bar-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border-decorative);padding-bottom:var(--safe-b)}
.tabs nav{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:480px;height:var(--tabh)}
.tabs a{position:relative;display:grid;justify-items:center;align-content:center;gap:4px;font:600 11px/1 var(--font-sans);color:var(--text-tertiary)}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current=page]{color:var(--text-primary)}
.tabs a[aria-current=page] svg{color:var(--teal)}
.tabs .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:10.5px}
.mini{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--safe-b));z-index:39;display:flex;justify-content:center;padding:0 10px 8px;pointer-events:none}
.mini[hidden]{display:none}
.mini>div{pointer-events:auto;position:relative;display:flex;align-items:center;gap:12px;width:100%;max-width:460px;padding:10px 12px;border-radius:14px;background:var(--surface-elevated);border:1px solid var(--border-glass);box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden}
.mini .pp{width:38px;height:38px;flex:none;border-radius:50%;background:var(--action-primary);color:#fff;font-size:11px}
.mini .tx{flex:1;min-width:0;display:grid;gap:2px;text-align:left}
.mini .tx b{font:600 13.5px/1.25 var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tx small{font:500 12px/1.2 var(--font-sans);color:var(--text-tertiary)}
.mini .x{width:32px;height:32px;color:var(--text-tertiary);font-size:16px}
.mini .pr{position:absolute;left:0;bottom:0;height:2px;background:var(--teal)}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);animation:shIn .2s ease}
.sheet[hidden]{display:none}
@keyframes shIn{from{opacity:0}to{opacity:1}}
.sheet .pn{width:100%;max-width:480px;max-height:88vh;overflow:auto;padding:8px 20px calc(24px + var(--safe-b));border-radius:22px 22px 0 0;background:var(--surface-elevated);border:1px solid var(--border-glass);border-bottom:0;animation:pnUp .26s cubic-bezier(.2,.8,.2,1)}
@keyframes pnUp{from{transform:translateY(40px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet .pn{animation:none}}
.sheet .grab{width:40px;height:5px;margin:4px auto 10px;border-radius:9999px;background:var(--track)}
.sheet .sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet .sh h2{margin:0;flex:1;font:700 19px/1.25 var(--font-sans);letter-spacing:-.2px}
.sheet .cl{width:34px;height:34px;border-radius:50%;background:var(--surface-glass);color:var(--text-secondary);font-size:15px}
.sheet p{margin:0 0 12px;font:400 14.5px/1.55 var(--font-sans);color:var(--text-secondary)}
.fld{display:grid;gap:8px;margin:16px 0 0}
.fld>span{font:600 13px/1.2 var(--font-sans);color:var(--text-secondary)}
.fld select,.fld textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--slate-600);background:var(--surface-raised);color:var(--text-primary);font:400 15px/1.4 var(--font-sans)}
.fld textarea{min-height:84px;resize:vertical}
.fld .err{font:500 12.5px/1.3 var(--font-sans);color:var(--red)}
.chk{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 2px;border-bottom:1px solid var(--border-decorative);font:500 14.5px/1.3 var(--font-sans)}
.chk input{width:20px;height:20px;accent-color:var(--teal)}
.moods{display:flex;flex-wrap:wrap;gap:8px}
.moods button{height:38px;padding:0 14px;border-radius:9999px;border:1px solid var(--border-decorative);font:600 13.5px/1 var(--font-sans);color:var(--text-secondary)}
.moods button[aria-pressed=true]{background:var(--surface-hover);border-color:var(--action-primary);color:var(--text-primary)}
.sheet .acts{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:20px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px}
.facts div{display:grid;gap:3px;padding:10px;border-radius:10px;background:var(--surface-glass);font:500 11.5px/1.2 var(--font-sans);color:var(--text-tertiary)}
.facts b{font:600 14.5px/1.2 var(--font-sans);color:var(--text-primary);font-variant-numeric:tabular-nums}
.chs .row{min-height:50px}
.chs .row.on b{color:var(--teal)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 16px);z-index:80;transform:translateX(-50%);max-width:calc(100% - 40px);padding:12px 16px;border-radius:12px;background:var(--text-primary);color:var(--surface-canvas);font:600 13.5px/1.35 var(--font-sans);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast[hidden]{display:none}
/* onboarding tip in the app sits above the tab bar */
.ob-tip{max-width:min(440px,calc(100vw - 24px))}
/* icons inside buttons and rows keep a fixed size */
.btn svg{width:17px;height:17px;flex:none}
.row .go svg{width:16px;height:16px}
/* the one-time tip highlights "For you" gently */
.b-dash.ob-pulse{box-shadow:none!important;animation:none!important;outline:0}
.b-dash.ob-pulse h2{text-decoration:underline;text-decoration-color:var(--action-primary);text-underline-offset:5px}

/* ---------- v2: greeting, brief card, strip ---------- */
.hello{padding:10px 0 4px}
.hello h1{margin:0;font:700 26px/1.2 var(--font-sans);letter-spacing:-.5px}
.hello p{margin:4px 0 0;font:500 13.5px/1.4 var(--font-sans);color:var(--text-tertiary)}
.brief{display:grid;gap:10px;margin-top:14px;padding:18px;border-radius:20px;background:linear-gradient(160deg,rgba(63,91,217,.16),rgba(63,91,217,0) 60%),var(--surface-raised)}
.brief h2{margin:0;font:700 22px/1.2 var(--font-sans);letter-spacing:-.4px}
.brief .sub{margin:0;font:400 15px/1.5 var(--font-sans);color:var(--text-secondary)}
.bp{display:flex;align-items:center;gap:12px;margin-top:6px}
.play{width:52px;height:52px;flex:none;border-radius:50%;background:var(--action-primary);color:#fff;font-size:15px;box-shadow:0 8px 20px rgba(63,91,217,.35)}
.play:active{transform:scale(.96)}
.bt{flex:1;min-width:0;display:grid;gap:3px}
.bt b{font:600 15px/1.2 var(--font-sans)}
.bt small{font:500 12.5px/1.2 var(--font-sans);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bpb{display:block;height:3px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:3px}
.bpb i{display:block;height:100%;width:0;background:var(--teal)}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.strip .nm{display:grid;gap:2px;padding:10px 12px;border-radius:14px;background:var(--surface-raised);border:1px solid var(--border-decorative);margin:0;border-left:1px solid var(--border-decorative)}
.strip .nm+.nm{padding-left:12px;margin-left:0}
.strip .nm b{font-size:15.5px}
.sl .tt b{font-size:22px}
.sl .tip{padding:9px 11px;border-radius:10px;background:var(--fb-info-soft);font:400 13px/1.45 var(--font-sans);color:var(--text-secondary)}

/* ---------- your morning ---------- */
.morning{margin-top:16px;padding:16px 16px 6px;border-radius:20px;transition:box-shadow .3s}
.morning.glow{box-shadow:0 0 0 2px var(--action-primary)}
.morning.all{background:linear-gradient(160deg,rgba(0,201,154,.14),rgba(0,201,154,0) 60%),var(--surface-raised)}
.mh{display:flex;align-items:center;gap:14px;padding-bottom:6px}
.mh h2{margin:0;font:700 17px/1.25 var(--font-sans)}
.mh small{font:500 13px/1.35 var(--font-sans);color:var(--text-tertiary)}
.mring{--p:0;position:relative;width:48px;height:48px;flex:none;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--track) 0);display:grid;place-items:center}
.mring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface-raised)}
.mring b{position:relative;font:700 13px/1 var(--font-sans)}
.steps{list-style:none;margin:0;padding:0}
.stp{display:flex;align-items:center;gap:12px;min-height:58px;border-top:1px solid var(--border-decorative)}
.stp>i{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-style:normal;font:700 12px/1 var(--font-sans);box-shadow:inset 0 0 0 2px var(--slate-500);color:var(--navy-900)}
.stp.ok>i{background:var(--teal);box-shadow:none}
.stp .tx{flex:1;min-width:0;display:grid;gap:2px}
.stp .tx b{font:600 15px/1.25 var(--font-sans)}
.stp.ok .tx b{color:var(--text-tertiary);text-decoration:line-through;text-decoration-color:var(--slate-500)}
.stp .tx small{font:400 12.5px/1.3 var(--font-sans);color:var(--text-tertiary)}
.stp .go{color:var(--text-tertiary);font-size:18px}

/* ---------- track record ---------- */
.trk{display:grid;gap:14px}
.trk .th{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.trk .th b{display:block;font:700 24px/1.1 var(--font-sans);letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.trk .th small{font:500 12.5px/1.3 var(--font-sans);color:var(--text-tertiary)}
.seq{position:relative;display:flex;align-items:center;gap:5px;height:68px;padding:0 2px}.seq::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--border-decorative)}
.seq i{position:relative;flex:1;border-radius:4px;background:var(--teal)}
.seq i.d{background:var(--slate-500)}
.seqx{display:flex;justify-content:space-between;margin-top:-6px;font:500 11px/1 var(--font-sans);color:var(--text-tertiary)}
.t3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.t3 div{display:grid;gap:3px;padding:10px;border-radius:12px;background:var(--surface-glass);font:500 11.5px/1.2 var(--font-sans);color:var(--text-tertiary)}
.t3 b{font:700 18px/1.1 var(--font-sans);color:var(--text-primary)}
.dotc{width:10px;height:10px;flex:none;border-radius:50%;background:var(--teal)}
.dotc.d{background:var(--slate-500)}.dotc.w{background:var(--amber)}
.row .tx b small{font:500 12px/1 var(--font-sans)}
.trl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface-glass);font:500 13.5px/1.3 var(--font-sans);color:var(--text-secondary)}
.trl span:last-child{color:var(--link);font-weight:600;white-space:nowrap}
.lv4 small{font:500 11px/1 var(--font-sans)}

/* ---------- native setup ---------- */
.onb{position:fixed;inset:0;z-index:90;display:flex;justify-content:center;background:var(--surface-canvas);overflow:auto;animation:scrIn .25s ease}
.ob-in{width:100%;max-width:480px;min-height:100%;display:flex;flex-direction:column;gap:12px;padding:16px 20px calc(28px + var(--safe-b))}
.ob-in h2{margin:6px 0 0;font:700 26px/1.2 var(--font-sans);letter-spacing:-.5px}
.ob-in p{margin:0;font:400 15px/1.5 var(--font-sans)}
.ob-bar{display:flex;align-items:center;gap:12px;min-height:44px}
.ob-back{width:40px;height:40px;border-radius:12px;border:1px solid var(--border-decorative);font-size:20px;color:var(--text-secondary)}
.ob-prog{flex:1;height:6px;border-radius:9999px;background:var(--track);overflow:hidden}
.ob-prog i{display:block;height:100%;border-radius:9999px;background:linear-gradient(90deg,var(--teal),var(--indigo-500));transition:width .3s}
.ob-skip{font:600 14px/1 var(--font-sans);color:var(--text-tertiary);padding:10px 4px}
.ob-opts{display:grid;gap:10px;margin:8px 0 6px}

/* ---------- rewards: free days, streak freezes, milestones, season, shoutout, badges ---------- */
.cap{margin:12px 0 0;font:400 12px/1.5 var(--font-sans);color:var(--text-tertiary)}
.lbar{display:block;height:6px;border-radius:9999px;background:var(--track);overflow:hidden;margin-top:6px}
.lbar em{display:block;height:100%;border-radius:inherit;background:var(--teal)}
.h2.sm{margin:20px 0 10px}.h2.sm h3{margin:0;font:600 15px/1.25 var(--font-sans)}
.fd .fdh,.stk .n{display:flex;align-items:center;gap:12px}
.fdh b{font:700 40px/1 var(--font-sans);font-variant-numeric:tabular-nums;color:var(--text-primary)}
.fdh>span{font:500 14px/1.35 var(--font-sans);color:var(--text-secondary)}
.fdt{position:relative;height:58px;margin:18px 8px 4px}
.fdbar{position:absolute;left:0;right:0;top:6px;height:8px;border-radius:9999px;background:var(--track);overflow:hidden}
.fdbar i{display:block;height:100%;background:var(--teal);border-radius:inherit}
.stop{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;gap:3px;text-align:center}

.stop i{width:20px;height:20px;border-radius:50%;background:var(--surface-raised);box-shadow:inset 0 0 0 2px var(--slate-400)}
.stop.got i{background:var(--teal);box-shadow:none}
.stop b{font:700 12.5px/1 var(--font-sans);color:var(--text-primary)}.stop small{font:500 11px/1 var(--font-sans);color:var(--text-tertiary);white-space:nowrap}
.fdl{list-style:none;margin:12px 0 0;padding:0}
.fdl li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border-decorative)}
.fdl li span{flex:1;display:grid;gap:2px}.fdl b{font:500 13.5px/1.3 var(--font-sans)}.fdl small{font:400 12px/1.3 var(--font-sans);color:var(--text-tertiary)}
.fdl em{font:600 13.5px/1 var(--font-sans);font-style:normal;color:var(--up-text);font-variant-numeric:tabular-nums;white-space:nowrap}
.frz{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--fb-info-soft)}
.frz .fz{display:flex;gap:2px;font-size:20px;line-height:1}.frz .fz i{font-style:normal;filter:grayscale(1);opacity:.35}.frz .fz i.on{filter:none;opacity:1}
.frz>span:last-child{display:grid;gap:3px}.frz b{font:600 13.5px/1.3 var(--font-sans)}.frz small{font:400 12px/1.45 var(--font-sans);color:var(--text-secondary)}
.ladder{list-style:none;margin:0;padding:6px 16px}
.ladder li{position:relative;display:flex;gap:12px;padding:10px 0}
.ladder li:not(:last-child)::before{content:"";position:absolute;left:13px;top:38px;bottom:-8px;width:2px;background:var(--border-decorative)}
.ladder li.got:not(:last-child)::before{background:var(--teal)}
.ladder i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--font-sans);font-style:normal;background:var(--surface-raised);box-shadow:inset 0 0 0 2px var(--slate-400);color:var(--text-secondary)}
.ladder .got i{background:var(--teal);box-shadow:none;color:var(--navy-900)}
.ladder .cur i{box-shadow:inset 0 0 0 2px var(--teal);color:var(--text-primary)}
.ladder li>span{flex:1;display:grid;gap:2px}.ladder b{font:600 13.5px/1.3 var(--font-sans)}.ladder small{font:400 12px/1.4 var(--font-sans);color:var(--text-tertiary)}
.ladder li:not(.got):not(.cur) b{color:var(--text-secondary)}
.sea .seh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sea .seh>div{display:grid;gap:4px}.sea .seh b{font:700 36px/1 var(--font-sans);font-variant-numeric:tabular-nums}.sea .seh small{font:500 13px/1.2 var(--font-sans);color:var(--text-secondary)}
.tb{margin-top:12px}.tb small{display:block;margin-top:6px;font:500 12px/1.3 var(--font-sans);color:var(--text-tertiary)}
.tier{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:9999px;background:var(--surface-glass);font:600 12px/1 var(--font-sans);color:var(--text-primary);white-space:nowrap}
.tier i{width:8px;height:8px;border-radius:50%;background:var(--slate-500)}
.tier.gold{background:var(--fb-warning-soft)}.tier.gold i{background:var(--amber)}.tier.silver i{background:var(--slate-200)}.tier.bronze i{background:var(--slate-600)}
.gold{margin:14px 0 12px}.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nmc{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:9999px;background:var(--surface-glass);font:500 12.5px/1 var(--font-sans);color:var(--text-secondary)}
.nmc.me{background:var(--fin-positive-soft);color:var(--text-primary);font-weight:600}.nmc.more{background:none;color:var(--text-tertiary)}
.sho{margin-top:12px}.sho h3{margin:6px 0 2px;font:600 18px/1.3 var(--font-sans)}.sho>p{margin:0;font-size:13px}
.rot{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.rot span{padding:5px 9px;border-radius:9999px;border:1px solid var(--border-decorative);font:500 11.5px/1 var(--font-sans);color:var(--text-tertiary)}
.rot .now{background:rgba(63,91,217,.16);border-color:transparent;color:var(--text-primary)}.rot .next{color:var(--text-secondary);border-color:var(--slate-400)}
.qual{display:grid;gap:3px;padding:12px;border-radius:12px;background:var(--surface-glass)}.qual b{font:600 13.5px/1.3 var(--font-sans)}.qual small{font:400 12px/1.45 var(--font-sans);color:var(--text-secondary)}
.hof{margin-top:14px;display:grid;gap:2px}.hof div{display:grid;grid-template-columns:24px 1fr;column-gap:8px;padding:8px 0;border-top:1px solid var(--border-decorative)}
.hof .eb{margin-bottom:4px}.hof i{grid-row:span 2;font-style:normal;font-size:16px}.hof b{font:600 13.5px/1.3 var(--font-sans)}.hof small{font:400 12px/1.3 var(--font-sans);color:var(--text-tertiary)}
.bdg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bd{display:grid;justify-items:center;align-content:start;gap:6px;min-height:118px;padding:14px 8px 12px;border-radius:14px;background:var(--surface-raised);border:1px solid var(--border-decorative);text-align:center;color:var(--text-primary);cursor:pointer}
.bd .be{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--surface-glass);filter:grayscale(1);opacity:.45}
.bd.got .be{filter:none;opacity:1;background:var(--fin-positive-soft)}
.bd b{font:600 12px/1.25 var(--font-sans)}.bd:not(.got) b{color:var(--text-secondary)}.bd small{font:500 11px/1 var(--font-sans);color:var(--up-text)}
.bd .lbar{width:70%;height:4px;margin-top:2px}
.bd:hover{border-color:var(--surface-hover-stroke,rgba(63,91,217,.3))}
.mfoot{display:flex;align-items:center;gap:12px;margin:4px -16px 0;padding:12px 16px;border-top:1px solid var(--border-decorative);font:500 12.5px/1.2 var(--font-sans);color:var(--text-secondary)}
.mfoot b{color:var(--text-primary);font-variant-numeric:tabular-nums}.mfoot .go{margin-left:auto;color:var(--text-tertiary)}
.tg{display:flex;align-items:center;gap:8px;margin:16px 0 2px}.tg small{font:500 12px/1 var(--font-sans);color:var(--text-tertiary)}
.row.me{background:var(--fin-positive-soft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:10px}
.stk .n b{white-space:nowrap}

/* ---------- streak hero (top of Today) and the Streak & rewards screen ---------- */
.hero{display:grid;justify-items:center;gap:10px;margin:14px 0 4px;padding:22px 16px 14px;border-radius:24px;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%,rgba(240,160,75,.16),rgba(240,160,75,0) 60%),var(--surface-raised);border:1px solid var(--border-decorative)}
.hero.all{background:radial-gradient(120% 90% at 50% 0%,rgba(0,201,154,.18),rgba(0,201,154,0) 60%),var(--surface-raised)}
.hring{--p:0;position:relative;width:148px;height:148px;border-radius:50%;display:grid;place-items:center;align-content:center;gap:2px;color:var(--text-primary);
  background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--track) 0)}
.hring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface-raised)}
.hring>*{position:relative}
.hring .fl{font-size:30px;line-height:1}
.hring b{font:800 46px/1 var(--font-sans);letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.hring small{font:600 11.5px/1 var(--font-sans);letter-spacing:1px;text-transform:uppercase;color:var(--text-tertiary)}
.hsub{margin:0;font:500 14px/1.35 var(--font-sans);color:var(--text-secondary)}
.hero .wk{width:100%;max-width:320px}
.hero .wk i,.rhead .wk i{width:28px;height:28px}
.hstats{display:flex;align-items:center;gap:10px;margin-top:4px;padding:9px 14px;border-radius:9999px;background:var(--surface-glass);font:500 12.5px/1 var(--font-sans);color:var(--text-secondary);white-space:nowrap}
.hstats b{color:var(--text-primary);font-variant-numeric:tabular-nums}.hstats i{width:1px;height:12px;background:var(--border-decorative)}.hstats em{font-style:normal;color:var(--text-tertiary);font-size:15px}
.hero.win .hring{animation:hwin .9s cubic-bezier(.2,1.4,.4,1)}
.hero.win .fl{animation:hfl 1.2s ease}
@keyframes hwin{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:none}}
@keyframes hfl{0%,100%{transform:none}30%{transform:scale(1.5) rotate(-8deg)}60%{transform:scale(1.2) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.hero.win .hring,.hero.win .fl{animation:none}}
.morning .mh{padding-bottom:4px}
.top .bk{display:grid;place-items:center;width:36px;height:36px;margin-left:-8px;border-radius:10px;font:400 30px/1 var(--font-sans);color:var(--text-primary)}
.rhead{display:grid;justify-items:center;gap:6px;margin-top:10px;padding:18px 16px 14px;border-radius:22px;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%,rgba(240,160,75,.16),rgba(240,160,75,0) 60%),var(--surface-raised);border:1px solid var(--border-decorative)}
.rhead .fl{font-size:34px;line-height:1}.rhead>b{font:800 52px/1 var(--font-sans);letter-spacing:-1.5px}
.rhead>small{font:500 13px/1 var(--font-sans);color:var(--text-tertiary);margin-bottom:6px}
.rhead .wk{width:100%;max-width:320px}
.frl{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:8px 12px;border-radius:9999px;background:var(--fb-info-soft);font:500 12.5px/1 var(--font-sans);color:var(--text-secondary)}
.frl i{font-style:normal;filter:grayscale(1);opacity:.35}.frl i.on{filter:none;opacity:1}.frl em{font-style:normal;color:var(--text-tertiary)}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.rt{display:grid;gap:5px;align-content:start;padding:14px;border-radius:16px;background:var(--surface-raised);border:1px solid var(--border-decorative);text-align:left;color:var(--text-primary)}
.rt b{display:flex;align-items:center;gap:8px;font:700 24px/1.1 var(--font-sans);font-variant-numeric:tabular-nums}.rt b small{font:500 13px/1 var(--font-sans);color:var(--text-tertiary)}
.rt b .tier{height:22px;font-size:11px;padding:0 8px}
.rt>small{font:400 12px/1.35 var(--font-sans);color:var(--text-tertiary);min-height:32px}
.rt .lbar{margin-top:2px}
.brow{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}.brow::-webkit-scrollbar{display:none}
.bc{flex:none;width:76px;display:grid;justify-items:center;gap:6px;text-align:center;color:var(--text-secondary)}
.bc span{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:var(--surface-glass);filter:grayscale(1);opacity:.4}
.bc.got span{filter:none;opacity:1;background:var(--fin-positive-soft)}
.bc small{font:500 11px/1.25 var(--font-sans)}
.shl{display:grid;gap:4px;width:100%;margin-top:16px;padding:14px;border-radius:16px;background:var(--surface-raised);border:1px solid var(--border-decorative);text-align:left;color:var(--text-primary)}
.shl b{font:600 14px/1.35 var(--font-sans)}.shl small{font:400 12.5px/1.4 var(--font-sans);color:var(--text-tertiary)}
.ylink{display:flex;align-items:center;gap:14px;margin-top:16px;color:var(--text-primary)}
.ylink .fl{font-size:28px}.ylink .tx{flex:1;display:grid;gap:3px}.ylink b{font:700 17px/1.2 var(--font-sans)}.ylink small{font:500 12.5px/1.3 var(--font-sans);color:var(--text-tertiary)}.ylink .go{color:var(--text-tertiary);font-size:20px}
.sheet .pn .sea,.sheet .pn .fd,.sheet .pn .ladder{border:0;padding-left:0;padding-right:0;background:none}
.sheet .pn .sho{background:var(--surface-glass);border:0}

/* compact streak pill, centred in the Today top bar (replaces the big ring) */
.top .spill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px 0 4px;border-radius:9999px;
  background:linear-gradient(90deg,rgba(240,160,75,.16),rgba(240,160,75,.06));border:1px solid rgba(240,160,75,.3);color:var(--text-primary);white-space:nowrap}
.top .spill.all{background:linear-gradient(90deg,rgba(0,201,154,.18),rgba(0,201,154,.06));border-color:rgba(0,201,154,.35)}
.sring{--p:0;position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--track) 0)}
.sring::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--surface-canvas)}
.sring span{position:relative;font-size:14px;line-height:1}
.spill b{font:800 17px/1 var(--font-sans);font-variant-numeric:tabular-nums}
.spill small{font:500 12px/1 var(--font-sans);color:var(--text-secondary)}
.spill.win{animation:hwin .9s cubic-bezier(.2,1.4,.4,1)}.spill.win .sring span{animation:hfl 1.2s ease}
@keyframes hwin{0%{transform:translate(-50%,-50%) scale(.85)}60%{transform:translate(-50%,-50%) scale(1.1)}100%{transform:translate(-50%,-50%)}}
.rhead .fl{font-size:24px}.rhead>b{font-size:38px}
@media (max-width:399px){.spill small{display:none}.top .spill{padding-right:12px}}

/* Your morning: steps slide sideways as small cards, so the card stays short */
.morning{padding:14px 0 14px}
.morning .mh{padding:0 16px 10px}
.morning .steps{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 2px;scroll-padding:0 16px;scrollbar-width:none}
.morning .steps::-webkit-scrollbar{display:none}
.morning .steps li{flex:none;width:148px;scroll-snap-align:start}
.morning .stp{position:relative;display:grid;align-content:start;gap:10px;min-height:0;height:100%;padding:12px;border:1px solid var(--border-decorative);border-top:1px solid var(--border-decorative);border-radius:14px;background:var(--surface-glass)}
.morning .stp .tx b{font-size:14px}.morning .stp .tx small{white-space:normal}
.morning .stp .go{position:absolute;top:10px;right:12px}
.morning .stp.ok{background:var(--fin-positive-soft);border-color:transparent}
.spill em{font-style:normal;font-size:16px;line-height:1;color:var(--text-tertiary);margin-left:-2px}

/* Your morning: one step at a time, full-width rectangle, swipe for the next */
.morning .steps li{width:calc(100% - 32px)}
.morning .stp{display:flex;align-items:center;gap:12px;height:auto;min-height:64px;padding:12px 14px}
.morning .stp .go{position:static}
.morning .stp .tx small{white-space:nowrap}
.mdots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.mdots i{width:6px;height:6px;border-radius:9999px;background:var(--track);transition:width .2s,background .2s}
.mdots i.ok{background:rgba(0,201,154,.45)}
.mdots i.on{width:18px;background:var(--text-secondary)}

/* Your morning, slim: no outer card, one-line header, thin slides; the next one peeks in from the right */
.morning,.morning.all{margin-top:14px;padding:0;border:0;border-radius:0;background:none}
.morning .mh{display:flex;align-items:baseline;gap:10px;padding:0 0 8px}
.morning .mh h2{flex:1;margin:0;font:600 15px/1.2 var(--font-sans)}
.morning .mh small{font:500 12.5px/1.2 var(--font-sans);color:var(--text-tertiary);white-space:nowrap}
.morning .steps{gap:8px;margin:0 -20px;padding:0 20px;scroll-padding:0 20px}
.morning .steps li{width:calc(100% - 56px)}
.morning .stp{gap:10px;min-height:0;padding:9px 12px;border-radius:12px;background:var(--surface-raised)}
.morning .stp>i{width:20px;height:20px;font-size:11px}
.morning .stp .tx{gap:1px}
.morning .stp .tx b{font:600 13.5px/1.25 var(--font-sans)}
.morning .stp .tx small{font-size:12px}
.morning .stp .go{font-size:16px}
.morning .stp.ok{background:var(--fin-positive-soft)}
.mdots{margin-top:7px}

/* one full-width step at a time; the rest wait stacked behind it */
.morning .steps{gap:20px;padding-bottom:10px}
.morning .steps li{width:calc(100% - 40px)}
.morning .steps li:not(:last-child) .stp{box-shadow:0 5px 0 -1px var(--surface-elevated),0 5px 0 0 var(--border-decorative),0 10px 0 -3px var(--surface-raised),0 10px 0 -2px var(--border-decorative)}
.mdots{margin-top:2px}
.morning .steps li{width:100%}

/* Your morning: colourful step cards (indigo brief, teal calls/market, amber review, blue learn) */
.morning .stp{--c:63,91,217;gap:12px;padding:10px 10px 10px 10px;border:1px solid rgba(var(--c),.35);
  background:linear-gradient(100deg,rgba(var(--c),.22),rgba(var(--c),.06) 70%),var(--surface-raised)}
.morning .stp.c-t{--c:0,201,154}.morning .stp.c-a{--c:240,160,75}.morning .stp.c-b{--c:50,130,232}
.morning .stp .si{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgb(var(--c));color:#fff;box-shadow:0 6px 16px rgba(var(--c),.35)}
.morning .stp.c-t .si,.morning .stp.c-a .si{color:#101827}
.morning .stp .si svg{width:20px;height:20px}
.morning .stp .tx em{font:700 10px/1.2 var(--font-sans);font-style:normal;letter-spacing:.9px;text-transform:uppercase;color:rgb(var(--c))}
.morning .stp .cta{flex:none;padding:8px 14px;border-radius:9999px;background:rgb(var(--c));color:#fff;font:700 12.5px/1 var(--font-sans)}
.morning .stp.c-t .cta,.morning .stp.c-a .cta{color:#101827}
.morning .stp.ok{--c:0,201,154;border-color:rgba(0,201,154,.3);background:linear-gradient(100deg,rgba(0,201,154,.16),rgba(0,201,154,.04) 70%),var(--surface-raised)}
.morning .stp.ok .cta{background:none;color:var(--up-text);padding-right:6px}
.morning .stp.ok .tx b{text-decoration:none;color:var(--text-secondary)}
:root[data-theme="light"] .morning .stp .tx em{color:var(--text-secondary)}
